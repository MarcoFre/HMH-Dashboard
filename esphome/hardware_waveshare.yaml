# HMH Hardware Waveshare ESP32-S3-Touch-LCD-7 V1
# Esperimento isolato Gaia RGB: driver ESPHome 2026.9.1 con
# bounce buffer DMA in SRAM da 16 righe (stock: 10).
# Per tornare al driver standard, rimuovere questo blocco.
external_components:
  - source:
      type: git
      url: https://github.com/MarcoFre/HMH-Dashboard
      ref: feature/gaia-06-responsive
      path: esphome/rgb_test_components
    components: [mipi_rgb]
    refresh: 0s

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: '256'
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: '32768'

psram:
  mode: octal
  speed: 80MHz

ota:
  - platform: esphome
    # ESPHome 2026.9+: cifra OTA riutilizzando la chiave api.encryption.
    encryption:
    on_begin:
      - lambda: hmh_boot_ota.begin();
    on_progress:
      - lambda: hmh_boot_ota.progress(x);
    on_end:
      - lambda: |-
          hmh_boot_ota.complete();
          esphome::delay(800);
    on_error:
      - lambda: hmh_boot_ota.error(x);

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${ip}
    gateway: 192.168.31.1
    subnet: 255.255.255.0

  on_connect:
    - script.execute: update_connection
  on_disconnect:
    - script.execute: update_connection

i2c:
  - id: i2c_main
    sda: GPIO8
    scl: GPIO9
    scan: true

ch422g:
  - id: ch422g_hub

touchscreen:
  - platform: gt911
    id: main_touch
    display: my_display
    i2c_id: i2c_main
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
      mode: OUTPUT
    update_interval: 20ms
    on_touch:
      - lambda: |-
          for (const auto &point : touches) if (point.state <= 2) {
            hmh_touch_start(point.x, point.y); hmh_navigation.check_direct_touch(); break;
          }
    on_update:
      - lambda: |-
          for (const auto &point : touches) if (point.state <= 2) {
            hmh_touch_update(point.x, point.y); hmh_navigation.check_direct_touch(); break;
          }
    on_release:
      - lambda: hmh_touch_end();
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false

display:
  - id: my_display
    platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    # Ripristinato il valore Waveshare precedente: il test a 10 MHz
    # ha causato perdita del video / possibile modalita' test RGB del pannello.
    pclk_frequency: 12MHz
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false

# Il preset mipi_rgb gestisce gia' EXIO2 (enable display).
# CH422G non offre PWM: questo output logico conserva il modello software
# di luminosita' originale senza pilotare pin sbagliati o duplicati.
# Per dimming reale occorre una modifica hardware/PWM separata.

output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: |-
          // Valore di luminosita' logico: nessun PWM sulla Waveshare V1 stock.
          (void) state;

light:
  - platform: monochromatic
    id: backlight
    name: "Luminosita (virtuale)"
    output: backlight_output
    default_transition_length: 200ms
    restore_mode: ALWAYS_ON
