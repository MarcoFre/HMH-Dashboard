# HMH Dashboard common 0.8.1 Gaia Composite Devices - GUI & runtime shared across Sunton/Waveshare
# Non installare direttamente: importato dai file entrypoint tramite packages.

substitutions:
  # URL locale di Home Assistant, raggiungibile da entrambi i display.
  ha_base_url: "http://192.168.31.182:8123"

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: calendar_payload
      variables:
        payload: string
      then:
        - lambda: |-
            hmh_calendar.load(payload);
  on_client_connected:
    - script.execute: update_connection
  on_client_disconnected:
    - script.execute: update_connection

esphome:
  includes:
    - room_sidebar.h
    - hmh_layout.h
    - hmh_tile_grid.h
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 0s
      - lambda: |-
          ESP_LOGI("ha_dashboard", "HMH Dashboard multi-hardware 0.8.1 Gaia Composite Devices");
          const auto hmh_screen = HmhLayout::current();
          char hmh_build_caption[48];
          snprintf(hmh_build_caption, sizeof(hmh_build_caption), "v0.8.1 | %dx%d", hmh_screen.width, hmh_screen.height);
          lv_label_set_text(id(status_build_label), hmh_build_caption);
          hmh_history_client=esphome::get_mac_address();
          hmh_calendar.attach(id(page_rooms)->obj);
          hmh_calendar.request=[](int year,int month){id(request_calendar).execute(year,month);};
          room_devices.on_energy=[](int day,const std::string &request) {id(request_energy).execute(day,request);};
          room_devices.on_history=[](const std::string &entity,int hours,const std::string &request) {id(request_sensor_history).execute(entity,hours,request);};
          hmh_chip_text_14=id(hmh_chip_14)->get_lv_font();
          hmh_set_text_fonts(id(hmh_text_16)->get_lv_font(), id(hmh_text_20)->get_lv_font(), id(hmh_text_28)->get_lv_font());
          hmh_widget_layout.load(std::string(id(dashboard_widget_preferences).data()));
          hmh_widget_layout.on_saved = [](const std::string &value) {
            id(dashboard_widget_preferences).fill(0);
            std::memcpy(id(dashboard_widget_preferences).data(), value.data(), value.size());
          };
          room_devices.attach(id(device_list), id(room_hint));
          room_sidebar.attach(id(room_list), id(room_title), id(room_hint));
          room_sidebar.bind_layout(id(sidebar), id(sidebar_heading), id(settings_button),
            id(settings_label), id(sidebar_toggle_label), id(device_list), id(mdi_area_28)->get_lv_font());
          room_devices.area_name = [](const std::string &area) { return room_sidebar.area_name(area); };
          hmh_navigation.clock_text = [](std::string &time, std::string &date) {
            auto now = id(dashboard_time).now();
            if (!now.is_valid()) return;
            time = now.strftime("%H:%M");
            static const char *days[] = {"Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"};
            static const char *months[] = {"", "gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"};
            date = std::string(days[now.day_of_week - 1]) + " " + std::to_string(now.day_of_month) + " " + months[now.month] + " " + std::to_string(now.year);
          };
          hmh_navigation.on_wake = []() {
            auto call = id(backlight).turn_on();
            call.set_brightness(1.0f);
            call.set_transition_length(200);
            call.perform();
            id(dashboard_night_dimmed) = false;
          };
          hmh_navigation.attach(id(hmh_clock_120)->get_lv_font());
          hmh_navigation.set_weather_icon_font(id(mdi_weather_64)->get_lv_font());
          hmh_boot_ota.attach(id(hmh_title_48)->get_lv_font(), id(mdi_area_28)->get_lv_font());
          room_sidebar.on_width_changed = [](int width) { room_devices.set_width(width); };
          room_devices.set_width(lv_obj_get_width(id(device_list))); // Gaia: sync layout after compact rail was applied.
          room_sidebar.on_selected = [](const std::string &area) {
            hmh_calendar.show(area=="@calendar");
            if(area=="@calendar") {room_devices.show(false);lv_obj_add_flag(id(room_hint),LV_OBJ_FLAG_HIDDEN);}
            else {lv_obj_clear_flag(id(room_hint),LV_OBJ_FLAG_HIDDEN);room_devices.set_area(area);}
          };
          room_sidebar.on_settings = []() { room_devices.show(false); };
          room_sidebar.set_theme_mode(id(dashboard_theme_mode));
          room_sidebar.set_night_brightness(id(dashboard_night_brightness_percent));
          room_sidebar.on_night_brightness_changed=[](int value) {
            id(dashboard_night_brightness_percent)=value;
          };
          room_sidebar.on_theme_changed = [](int mode) { id(dashboard_theme_mode) = mode; };
          room_sidebar.on_theme_applied = []() { room_devices.refresh_theme(); };
          auto now = id(dashboard_time).now();
          room_sidebar.update_theme(now.hour, now.is_valid());
          room_sidebar.set_preferences(std::string(id(dashboard_room_preferences).data()));
          room_sidebar.on_preferences_changed = [](const std::string &value) {
            id(dashboard_room_preferences).fill(0);
            std::memcpy(id(dashboard_room_preferences).data(), value.data(), value.size());
          };
          room_devices.on_cover = [](const std::string &entity, const std::string &command) {
            id(send_cover_command).execute(entity, command);
          };
          room_devices.on_temperature = [](const std::string &entity, float value) {
            id(send_climate_temperature).execute(entity, value);
          };
          room_devices.on_temperature_range = [](const std::string &entity, float low, float high) {
            id(send_climate_range).execute(entity, low, high);
          };
          room_devices.on_hvac_mode = [](const std::string &entity, const std::string &mode) {
            id(send_climate_mode).execute(entity, mode);
          };
          room_devices.on_alarm = [](const std::string &entity, const std::string &action, const std::string &code) { id(send_alarm_command).execute(entity, action, code); };
          room_devices.on_number = [](const std::string &entity, float value) { id(send_number_value).execute(entity, value); };
          room_devices.on_fan_percentage = [](const std::string &entity, int percentage) {
            id(send_fan_percentage).execute(entity, percentage);
          };
          room_devices.on_brightness = [](const std::string &entity, int brightness) {
            id(send_light_brightness).execute(entity, brightness);
          };
          room_devices.on_color = [](const std::string &entity, int red, int green, int blue) {
            id(send_light_color).execute(entity, red, green, blue);
          };
          room_devices.on_command = [](const std::string &action, const std::string &entity) {
            id(send_device_command).execute(action, entity);
          };
      - script.execute: rebuild_rooms
      - script.execute: update_devices
      - script.execute: update_connection

preferences:
  flash_write_interval: 1s

time:
  - platform: homeassistant
    id: dashboard_time
    timezone: Europe/Rome

globals:
  - id: standby_wanted_url
    type: std::string
    initial_value: '""'
  - id: standby_requested_url
    type: std::string
    initial_value: '""'
  - id: standby_download_busy
    type: bool
    initial_value: 'false'
  - id: standby_image_ready
    type: bool
    initial_value: 'false'
  - id: standby_last_attempt
    type: uint32_t
    initial_value: '0'
  - id: dashboard_night_brightness_percent
    type: int
    restore_value: true
    initial_value: '55'
  - id: dashboard_night_dimmed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dashboard_widget_preferences
    type: std::array<char, 4096>
    restore_value: true
    update_interval: 1s
    initial_value: 'std::array<char, 4096>{}'
  - id: dashboard_theme_mode
    type: int
    restore_value: true
    initial_value: '0'
  - id: dashboard_room_preferences
    type: std::array<char, 2048>
    restore_value: true
    update_interval: 100ms
    initial_value: 'std::array<char, 2048>{}'

logger:
  level: DEBUG

json:

http_request:
  timeout: 10s
  verify_ssl: true

image:
  - platform: online_image
    id: standby_background
    url: "${ha_base_url}/local/hmh-standby-placeholder.png"
    format: AUTO
    type: RGB565
    resize: 800x480
    byte_order: little_endian
    update_interval: never
    on_download_finished:
      - lambda: |-
          id(standby_download_busy) = false;
          if (!id(standby_wanted_url).empty() &&
              id(standby_requested_url) == id(standby_wanted_url)) {
            hmh_navigation.set_background(id(standby_background)->get_lv_image_dsc());
            id(standby_image_ready) = true;
          }
    on_error:
      - lambda: |-
          id(standby_download_busy) = false;
          id(standby_image_ready) = false;
          hmh_navigation.clear_background();
          ESP_LOGW("hmh_standby", "Sfondo non disponibile; nuovo tentativo tra 60 secondi");

text_sensor:
  - platform: homeassistant
    id: ha_standby_background
    entity_id: sensor.hmh_dashboard_sfondo
    attribute: url
    internal: true
    on_value:
      - lambda: |-
          std::string url = x;
          if (url.empty() || url == "unknown" || url == "unavailable" || url == "None") url.clear();
          else if (url[0] == '/' && (url.size() == 1 || url[1] != '/'))
            url = std::string("${ha_base_url}") + url;
          else if (url.rfind("http://", 0) != 0 && url.rfind("https://", 0) != 0) url.clear();
          if (url == id(standby_wanted_url)) return;
          id(standby_wanted_url) = url;
          id(standby_image_ready) = false;
          hmh_navigation.clear_background();

  - platform: homeassistant
    id: hmh_calendar_availability
    entity_id: sensor.hmh_dashboard_calendar_status
    internal: true
    on_value:
      then:
        - lambda: |-
            bool enabled=x=="on";
            hmh_calendar.set_enabled(enabled);
            if(!enabled && room_sidebar.page_mode()==4)room_sidebar.set_page(0);

  - platform: homeassistant
    id: ha_room_catalog
    entity_id: sensor.ha_dashboard_catalog
    attribute: catalogo
    internal: true

  - platform: homeassistant
    id: ha_device_catalog
    entity_id: sensor.ha_dashboard_catalog
    attribute: entita
    internal: true

  - platform: homeassistant
    id: ha_sensor_history
    entity_id: sensor.ha_dashboard_catalog
    attribute: storico
    internal: true
    on_value:
      then:
        - lambda: room_devices.load_history(x);

  - platform: homeassistant
    id: ha_energy_chart
    entity_id: sensor.ha_dashboard_catalog
    attribute: energia
    internal: true
    on_value:
      then:
        - lambda: room_devices.load_energy(x);

script:
  - id: request_calendar
    mode: restart
    parameters:
      year: int
      month: int
    then:
      - homeassistant.event:
          event: esphome.hmh_dashboard_calendar_request
          data:
            year: !lambda return std::to_string(year);
            month: !lambda return std::to_string(month);
            device: !lambda return App.get_name();
  - id: request_energy
    mode: restart
    parameters:
      day: int
      request_id: string
    then:
      - homeassistant.event:
          event: esphome.hmh_dashboard_energy
          data:
            day: !lambda return std::to_string(day);
            request_id: !lambda return request_id;
  - id: request_sensor_history
    mode: restart
    parameters:
      target_entity: string
      hours: int
      request_id: string
    then:
      - homeassistant.event:
          event: esphome.hmh_dashboard_history
          data:
            entity_id: !lambda return target_entity;
            hours: !lambda return std::to_string(hours);
            request_id: !lambda return request_id;
  - id: send_cover_command
    mode: queued
    max_runs: 10
    parameters:
      target_entity: string
      cover_command: string
    then:
      - if:
          condition:
            lambda: return cover_command == "open_cover";
          then:
            - homeassistant.action:
                action: cover.open_cover
                data:
                  entity_id: !lambda return target_entity;
      - if:
          condition:
            lambda: return cover_command == "close_cover";
          then:
            - homeassistant.action:
                action: cover.close_cover
                data:
                  entity_id: !lambda return target_entity;
      - if:
          condition:
            lambda: return cover_command == "stop_cover";
          then:
            - homeassistant.action:
                action: cover.stop_cover
                data:
                  entity_id: !lambda return target_entity;
  - id: send_climate_temperature
    mode: queued
    max_runs: 20
    parameters:
      target_entity: string
      target_value: float
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda return target_entity;
            temperature: !lambda return std::to_string(target_value);
  - id: send_climate_range
    mode: queued
    max_runs: 20
    parameters:
      target_entity: string
      target_low: float
      target_high: float
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda return target_entity;
            target_temp_low: !lambda return std::to_string(target_low);
            target_temp_high: !lambda return std::to_string(target_high);
  - id: send_climate_mode
    mode: queued
    max_runs: 10
    parameters:
      target_entity: string
      target_mode: string
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda return target_entity;
            hvac_mode: !lambda return target_mode;
  - id: send_alarm_command
    mode: single
    parameters:
      target_entity: string
      alarm_action: string
      alarm_code: string
    then:
      - if:
          condition:
            lambda: return !hmh_navigation_blocked && id(wifi_component).is_connected() && id(api_server).is_connected();
          then:
            - if:
                condition:
                  lambda: return !alarm_code.empty();
                then:
                  - homeassistant.action:
                      action: !lambda return "alarm_control_panel." + alarm_action;
                      data:
                        entity_id: !lambda return target_entity;
                        code: !lambda return alarm_code;
                else:
                  - homeassistant.action:
                      action: !lambda return "alarm_control_panel." + alarm_action;
                      data:
                        entity_id: !lambda return target_entity;
      - lambda: |-
          std::fill(alarm_code.begin(), alarm_code.end(), '\0');
          alarm_code.clear();
  - id: send_number_value
    mode: restart
    parameters:
      target_entity: string
      number_value: float
    then:
      - if:
          condition:
            lambda: return !hmh_navigation_blocked && id(wifi_component).is_connected() && id(api_server).is_connected();
          then:
            - homeassistant.action:
                action: !lambda |-
                  return target_entity.rfind("input_number.", 0) == 0 ? "input_number.set_value" : "number.set_value";
                data:
                  entity_id: !lambda return target_entity;
                  value: !lambda return std::to_string(number_value);
  - id: send_fan_percentage
    mode: restart
    parameters:
      target_entity: string
      percentage_value: int
    then:
      - if:
          condition:
            lambda: return !hmh_navigation_blocked && id(wifi_component).is_connected() && id(api_server).is_connected();
          then:
            - homeassistant.action:
                action: fan.set_percentage
                data:
                  entity_id: !lambda return target_entity;
                  percentage: !lambda return std::to_string(percentage_value);
  - id: send_light_brightness
    mode: restart
    parameters:
      target_entity: string
      brightness_value: int
    then:
      - if:
          condition:
            lambda: return !hmh_navigation_blocked && id(wifi_component).is_connected() && id(api_server).is_connected();
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return target_entity;
                  brightness: !lambda return std::to_string(brightness_value);
  - id: send_light_color
    mode: restart
    parameters:
      target_entity: string
      red_value: int
      green_value: int
      blue_value: int
    then:
      - if:
          condition:
            lambda: return !hmh_navigation_blocked && id(wifi_component).is_connected() && id(api_server).is_connected();
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda return target_entity;
                data_template:
                  rgb_color: "{{ [red | int, green | int, blue | int] }}"
                variables:
                  red: !lambda return std::to_string(red_value);
                  green: !lambda return std::to_string(green_value);
                  blue: !lambda return std::to_string(blue_value);
  - id: update_devices
    mode: restart
    then:
      - lambda: |-
          // Avoid recreating LVGL cards when the HA catalog is unchanged.
          static std::string last_devices_catalog;
          static bool catalog_loaded = false;
          if (id(ha_device_catalog).has_state()) {
            const std::string &catalog = id(ha_device_catalog).state;
            if (!catalog_loaded || catalog != last_devices_catalog) {
              hmh_load_weather(catalog);
              room_devices.load(catalog);
              room_sidebar.sync_categories(room_devices.category_mask());
              room_sidebar.sync_batteries(room_devices.battery_areas());
              last_devices_catalog = catalog;
              catalog_loaded = true;
              ESP_LOGD("ha_dashboard", "Catalogo dispositivi aggiornato: refresh GUI");
            }
          }
          // Poll timers remain active even with an unchanged catalog.
          room_devices.poll_history();
          room_devices.poll_energy();
  - id: send_device_command
    mode: queued
    max_runs: 10
    parameters:
      action_name: string
      target_entity: string
    then:
      - if:
          condition:
            lambda: return !hmh_navigation_blocked && id(wifi_component).is_connected() && id(api_server).is_connected();
          then:
            - homeassistant.action:
                action: !lambda return action_name;
                data:
                  entity_id: !lambda return target_entity;
  - id: rebuild_rooms
    mode: restart
    then:
      - lambda: |-
          if (!id(ha_room_catalog).has_state()) return;
          static std::string last_room_catalog;
          static bool rooms_loaded = false;
          const std::string &catalog = id(ha_room_catalog).state;
          if (!rooms_loaded || catalog != last_room_catalog) {
            room_sidebar.load(catalog);
            last_room_catalog = catalog;
            rooms_loaded = true;
            ESP_LOGD("ha_dashboard", "Catalogo stanze aggiornato: refresh sidebar");
          }
  - id: update_connection
    mode: restart
    then:
      - lambda: |-
          room_devices.set_online(id(wifi_component).is_connected() && id(api_server).is_connected());
      - lambda: |-
          const bool connected = id(wifi_component).is_connected() && id(api_server).is_connected();
          lv_obj_set_style_text_color(id(connection_label), lv_color_hex(connected ? 0x22C55E : 0xEF4444), 0);

interval:
  # Serializza i download: mai liberare un buffer ancora in uso dal decoder.
  - interval: 2s
    then:
      - lambda: |-
          if (id(standby_download_busy)) return;
          const auto &wanted = id(standby_wanted_url);
          if (wanted.empty()) {
            hmh_navigation.clear_background();
            id(standby_background)->release();
            id(standby_requested_url).clear();
            id(standby_image_ready) = false;
            return;
          }
          const uint32_t elapsed = millis() - id(standby_last_attempt);
          const bool changed = wanted != id(standby_requested_url);
          if (!changed && elapsed < (id(standby_image_ready) ? 900000U : 60000U)) return;
          if (!id(wifi_component).is_connected()) return;
          hmh_navigation.clear_background();
          id(standby_background)->release();
          id(standby_requested_url) = wanted;
          id(standby_image_ready) = false;
          id(standby_download_busy) = true;
          id(standby_last_attempt) = millis();
          id(standby_background)->set_url(wanted);
          id(standby_background)->update();
  - interval: 1s
    then:
      - script.execute: rebuild_rooms
      - script.execute: update_devices
      - lambda: |-
          hmh_navigation.tick();
          auto status_now = id(dashboard_time).now();
          if(status_now.is_valid())hmh_calendar.set_now(status_now.year,status_now.month,status_now.day_of_month,status_now.hour,status_now.minute);
          lv_label_set_text(id(status_clock), status_now.is_valid() ? status_now.strftime("%H:%M").c_str() : "--:--");
          lv_label_set_text(id(status_date), status_now.is_valid() ? status_now.strftime("%d/%m/%Y").c_str() : "--/--/----");
          lv_obj_set_style_text_color(id(connection_label), lv_color_hex(id(wifi_component).is_connected() && id(api_server).is_connected() ? 0x22C55E : 0xEF4444), 0);
          auto now = id(dashboard_time).now();
          const bool dim = now.is_valid() && (now.hour >= 22 || now.hour < 7) &&
                           hmh_navigation.is_standby() && !hmh_status_busy;
          const float brightness=dim ? std::clamp(id(dashboard_night_brightness_percent),55,100)/100.0f : 1.0f;
          if (dim != id(dashboard_night_dimmed) ||
              (dim && std::abs(id(backlight).remote_values.get_brightness()-brightness)>0.005f)) {
            auto call = id(backlight).turn_on();
            call.set_brightness(brightness);
            call.set_transition_length(dim ? 3000 : 200);
            call.perform();
            id(dashboard_night_dimmed) = dim;
          }
  - interval: 5s
    then:
      - script.execute: update_connection
      - lambda: |-
          auto now = id(dashboard_time).now();
          room_sidebar.update_theme(now.hour, now.is_valid());

lvgl:
  displays: [my_display]
  touchscreens: [main_touch]
  default_font: hmh_text_20
  buffer_size: 12%
  bg_color: 0x0B1220
  text_color: 0xEAF2FF
  pages:
    - id: page_rooms
      bg_color: 0x0B1220
      widgets:
        - obj:
            id: status_bar
            x: 0
            y: 0
            width: 800
            height: 54
            pad_all: 0
            radius: 0
            border_width: 0
            bg_color: 0x0B1220
            scrollable: false
            widgets:
              - label:
                  x: 16
                  y: 5
                  width: 240
                  text: "HMH Dashboard"
                  text_font: hmh_text_20
                  text_color: 0x22D3EE
              - label:
                  id: status_build_label
                  x: 16
                  y: 31
                  width: 240
                  text: "v0.8.1 | --x--"
                  text_font: hmh_text_16
                  text_color: 0x94A3B8
              - label:
                  id: status_clock
                  x: 270
                  y: 4
                  width: 260
                  text_align: CENTER
                  text: "--:--"
                  text_font: hmh_text_20
              - label:
                  id: status_date
                  x: 270
                  y: 29
                  width: 260
                  text_align: CENTER
                  text: "--/--/----"
                  text_font: hmh_text_16
                  text_color: 0x94A3B8
              - label:
                  id: connection_label
                  x: 744
                  y: 12
                  width: 40
                  text_align: CENTER
                  text_font: mdi_area_28
                  text: "\U000F07D0"
                  text_color: 0xEF4444
        - obj:
            id: sidebar
            x: 0
            y: 54
            width: 200
            height: 426
            pad_all: 0
            radius: 0
            border_width: 0
            bg_color: 0x111827
            widgets:
              - button:
                  x: 8
                  y: 8
                  width: 30
                  height: 28
                  pad_all: 0
                  bg_color: 0x1E293B
                  radius: 8
