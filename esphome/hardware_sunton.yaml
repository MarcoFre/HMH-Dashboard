# HMH Hardware Sunton ESP32-8048S070
# Preserve the Sunton-specific memory/flash build parameters.
esphome:
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
    board_upload.maximum_ram_size: 524288

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: '256'
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: '32768' 
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y

psram:
  mode: octal
  speed: 80MHz

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - lambda: hmh_boot_ota.begin();
    on_progress:
      - lambda: hmh_boot_ota.progress(x);
    on_end:
      - lambda: |-
          hmh_boot_ota.complete();
          esphome::delay(800);
    on_error:
      - lambda: hmh_boot_ota.error(x);

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${ip}
    gateway: 192.168.31.1
    subnet: 255.255.255.0

  on_connect:
    - script.execute: update_connection
  on_disconnect:
    - script.execute: update_connection

i2c:
  sda: 19
  scl: 20
  scan: true

touchscreen:
  - platform: gt911
    id: main_touch
    display: my_display
    reset_pin: 38
    update_interval: 20ms
    on_touch:
      - lambda: |-
          for (const auto &point : touches) if (point.state <= 2) {
            hmh_touch_start(point.x, point.y); hmh_navigation.check_direct_touch(); break;
          }
    on_update:
      - lambda: |-
          for (const auto &point : touches) if (point.state <= 2) {
            hmh_touch_update(point.x, point.y); hmh_navigation.check_direct_touch(); break;
          }
    on_release:
      - lambda: hmh_touch_end();
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false

i2s_audio:
  - id: audio_out
    i2s_lrclk_pin: 18
    i2s_bclk_pin: 0
  - id: audio_in
    i2s_lrclk_pin: 13
    i2s_bclk_pin: 12

display:
  - id: my_display
    platform: rpi_dpi_rgb
    rotation: 0
    dimensions:
      width: 800
      height: 480
    color_order: RGB
    invert_colors: false
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 42
    pclk_frequency: 10MHz
    data_pins:
      red: [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue: [15, 7, 6, 5, 4]
    update_interval: never
    auto_clear_enabled: false

output:
  - id: backlight_output
    platform: ledc
    pin: 2

light:
  - platform: monochromatic
    id: backlight
    name: "Luminosita"
    output: backlight_output
    default_transition_length: 200ms
    restore_mode: ALWAYS_ON
